name: HarmonyOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - document
      - ci/harmony-apk
      - 'feat/**'
      - 'fix/**'
    paths:
      - '.github/workflows/harmony-apk.yml'
      - 'app/**'
      - 'src/**'
      - 'tools/**'
      - 'profile-core/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: harmony-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ONDK_VERSION: r30.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - name: Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v6

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '${{ runner.temp }}/ondk'
          curl --fail --location --retry 3 \
            "https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz" \
            --output '${{ runner.temp }}/ondk.tar.xz'
          tar -C '${{ runner.temp }}/ondk' --strip-components=1 -xf '${{ runner.temp }}/ondk.tar.xz'

      - name: Install ONDK Rust toolchain
        run: rustup toolchain link ondk '${{ runner.temp }}/ondk/toolchains/rust'

      - name: Run required Mate 50 Pro preflight tests
        env:
          ONDK_HOME: ${{ runner.temp }}/ondk
          ANDROID_NDK_HOME: ${{ runner.temp }}/ondk
          ANDROID_NDK_ROOT: ${{ runner.temp }}/ondk
        run: ./gradlew :app:testDebugUnitTest --tests com.sesame.app.ui.Mate50PreflightTest --no-daemon --stacktrace

      # Upstream AnchorMergeProbeTest requires external/port/<release>.conf,
      # a machine-local fixture absent from GitHub clean checkouts.
      - name: Upstream JVM suite (informational; external fixture missing)
        continue-on-error: true
        env:
          ONDK_HOME: ${{ runner.temp }}/ondk
          ANDROID_NDK_HOME: ${{ runner.temp }}/ondk
          ANDROID_NDK_ROOT: ${{ runner.temp }}/ondk
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build APK (debug signing; no signing secrets)
        env:
          ONDK_HOME: ${{ runner.temp }}/ondk
          ANDROID_NDK_HOME: ${{ runner.temp }}/ondk
          ANDROID_NDK_ROOT: ${{ runner.temp }}/ondk
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK with SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find build/app/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist/GhostLock-HarmonyOS-ARM64-debug.apk
          (cd dist && sha256sum GhostLock-HarmonyOS-ARM64-debug.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-HarmonyOS-debug-apk
          path: dist/
          retention-days: 14
          if-no-files-found: error
